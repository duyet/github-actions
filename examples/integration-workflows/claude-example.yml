name: Claude Code

on:
  # Code review: PR assignment or @duyetbot mentions
  pull_request:
    types: [opened, assigned, synchronize]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  # Interactive help: mentions in comments
  issue_comment:
    types: [created]

  # Issue planning: issue assignment
  issues:
    types: [opened, assigned]

jobs:
  claude:
    uses: duyet/github-actions/.github/workflows/claude.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      # Optional: customize these values
      provider: 'openrouter'  # or 'anthropic'
      model: '@preset/claude-code-github-action'
      allowed_tools: 'Read,Grep,Glob,Bash,Plan'
      bot_id: '101855044'
      bot_name: 'duyetbot'
