name: Claude Code

on:
  # Code review: PR assignment or @duyetbot mentions
  pull_request:
    types: [opened, assigned, synchronize]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  # Interactive help: mentions in comments
  issue_comment:
    types: [created]

  # Issue planning: issue assignment
  issues:
    types: [opened, assigned]

# Required permissions for the reusable workflow
# These permissions are inherited by the called workflow's jobs
permissions:
  contents: write        # For checking out code and pushing changes
  pull-requests: write   # For commenting on PRs
  issues: write          # For commenting on and managing issues
  actions: read          # For reading workflow run details
  id-token: write        # For OIDC token generation

jobs:
  claude:
    uses: duyet/github-actions/.github/workflows/claude.yml@main
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
      bot_github_token: ${{ secrets.DUYETBOT_GITHUB_TOKEN }}
    with:
      # Optional: customize these values
      provider: 'openrouter'  # or 'anthropic'
      model: '@preset/claude-code-github-action'
      allowed_tools: 'Read,Grep,Glob,Bash,Plan'
      bot_id: '101855044'
      bot_name: 'duyetbot'
