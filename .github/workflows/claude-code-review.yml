name: Claude Code Review

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: 'Comma-separated list of allowed Claude tools'
        required: false
        type: string
        default: 'Read,Grep,Glob,Bash,Plan,Write,Edit'

      file_patterns:
        description: 'Comma-separated file patterns to review (leave empty for all files)'
        required: false
        type: string
        default: ''

      provider:
        description: 'API provider to use (openrouter, anthropic, or zai)'
        required: false
        type: string
        default: 'openrouter'

      model:
        description: 'Model to use (e.g., anthropic/claude-3.5-haiku, @preset/claude-code-github-action)'
        required: false
        type: string
        default: '@preset/claude-code-github-action'

      show_full_output:
        description: 'Show full JSON output from Claude Code (WARNING: may expose secrets in logs)'
        required: false
        type: boolean
        default: true

      bot_name:
        description: 'GitHub bot name'
        required: false
        type: string
        default: 'duyetbot'

      mcp_config:
        description: 'MCP server configuration JSON string or path to JSON file'
        required: false
        type: string
        default: '.github/mcp-config.json'

      plugins:
        description: 'Newline-separated list of Claude Code plugins to install'
        required: false
        type: string
        default: ''

      plugin_marketplaces:
        description: 'Newline-separated list of plugin marketplace Git URLs'
        required: false
        type: string
        default: 'https://github.com/duyet/claude-plugins.git'

    secrets:
      api_key:
        description: 'API key (Anthropic or OpenRouter)'
        required: true

      bot_github_token:
        description: 'GitHub token for bot operations (PAT with repo access)'
        required: false

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
      id-token: write
    steps:
      - name: Wait for CI checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const maxWaitTime = 30 * 60 * 1000; // 30 minutes
            const pollInterval = 10 * 1000; // 10 seconds
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitTime) {
              const checkRuns = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });

              const statuses = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });

              const allChecks = checkRuns.data.check_runs;
              const allCompleted = allChecks.every(check =>
                check.status === 'completed' || check.conclusion
              );

              if (allCompleted) {
                core.info(`All CI checks completed. Status: ${statuses.data.state}`);
                return;
              }

              core.info('Waiting for CI checks to complete...');
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            core.warning('CI checks did not complete within 30 minutes');

  claude-review:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
      id-token: write
      actions: read
    env:
      ANTHROPIC_BASE_URL_VALUE: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.bot_github_token }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ inputs.bot_name }}"
          git config --global user.email "${{ inputs.bot_name }}@users.noreply.github.com"

      - name: Check CI Status
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const checkRuns = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
            });

            const statuses = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: pr.head.sha,
            });

            const failedChecks = checkRuns.data.check_runs.filter(
              check => check.conclusion === 'failure'
            );

            const hasFailures = statuses.data.state === 'failure' || failedChecks.length > 0;

            let ciSummary = `Overall CI Status: ${statuses.data.state}\n\n`;
            ciSummary += `Total Checks: ${checkRuns.data.check_runs.length}\n`;

            if (failedChecks.length > 0) {
              ciSummary += `\n## Failed Checks:\n`;
              for (const check of failedChecks) {
                ciSummary += `- **${check.name}** (${check.conclusion})\n`;
                if (check.details_url) {
                  ciSummary += `  [View Details](${check.details_url})\n`;
                }
              }
            }

            core.setOutput('has-failures', hasFailures);
            core.setOutput('ci-summary', ciSummary);
            core.setOutput('failed-checks-count', failedChecks.length);

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL_VALUE }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowed-tools ${{ inputs.allowed_tools }}
            --mcp-config ${{ inputs.mcp_config }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            MODEL: ${{ inputs.model }}
            PROVIDER: ${{ inputs.provider }}
            ${{ inputs.file_patterns != '' && format('FILE PATTERNS: {0}', inputs.file_patterns) || '' }}

            ## CI/CD Status
            ${{ steps.ci-status.outputs.ci-summary }}

            ## Task
            Review this pull request and provide comprehensive feedback.

            ${{ steps.ci-status.outputs.has-failures == 'true' && format('**IMPORTANT: CI checks have failed. Analyze the failures and make code changes to fix them.**') || '' }}

            ## Review Scope
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md (if available) for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            ## CI Failure Resolution (if applicable)
            ${{ steps.ci-status.outputs.has-failures == 'true' && format('
            If CI checks have failed:
            1. **Analyze the failures:** Understand what each failed check reports
            2. **Root cause analysis:** Use Read, Grep, Bash to investigate the failure causes
            3. **Fix the code:** Use Edit or Write to make necessary corrections
            4. **Verify the fix:** Run relevant local tests/linters if possible using Bash
            5. **Commit changes:** Use Bash to commit fixes with semantic commit message
               - Format: `fix: <scope> - <description> (PR #{PR_NUMBER})`
               - Example: `fix: auth - resolve JWT validation issue (PR #123)`
            6. **Push changes:** Push to the PR branch using Bash
            7. **Comment:** Leave a comment describing the fixes made
            ') || '' }}

            ## Semantic Commit Format
            When creating commits, use semantic format:
            - **Format:** `<type>: <scope> - <subject> (PR #<number>)`
            - **Types:** `fix`, `feat`, `docs`, `refactor`, `perf`, `chore`, `test`
            - **Always include PR number:** `(PR #${{ github.event.pull_request.number }})`

            ## Inline Comments
            For specific code issues, use inline review comments on the exact lines:

            ### Creating Inline Review Comments
            Use the GitHub CLI to create line-specific review comments:

            ```bash
            # Single line comment
            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              -f body="Your review feedback here" \
              -f commit_id="${{ github.event.pull_request.head.sha }}" \
              -f path="path/to/file.ext" \
              -f position=42

            # position is the line number in the diff
            # path is the file path relative to repo root
            # commit_id is the PR head SHA
            ```

            ### Comment Strategy

            ### Batch Comments
            For multiple inline comments, create a JSON file and use `gh api` with batch input:

            ```bash
            # Create comments.json
            cat > comments.json << 'EOF'
            [
              {"body": "Consider using const here", "commit_id": "SHA", "path": "src/file.js", "position": 10},
              {"body": "Missing error handling", "commit_id": "SHA", "path": "src/file.js", "position": 25}
            ]
            EOF

            # Apply all comments
            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              --input comments.json
            ```

            ## PR-Level Comment Format
            When leaving an overall review summary (after inline comments, if any):

            ### Step 1: Find Existing Bot Comment
            First, check if there's already a review comment from this bot on this PR:

            ```bash
            # Search for existing comment by bot
            EXISTING_COMMENT=$(gh api \
              repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq ".[] | select(.user.login == \"${{ inputs.bot_name }}\") | select(.body | contains(\"📊 Review metadata\")) | .id" | head -n1)

            if [ -n "$EXISTING_COMMENT" ]; then
              echo "Found existing comment ID: $EXISTING_COMMENT"
            else
              echo "No existing comment found, will create new"
            fi
            ```

            ### Step 2: Prepare Comment Body
            Create your review summary with this EXACT format:

            ```markdown
            <details>
            <summary>📊 Review metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | MODEL_NAME_HERE |
            | Provider | PROVIDER_HERE |
            | Tools | LIST_OF_TOOLS_USED |
            | Reviewed by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |
            | Updated | UPDATE_TIMESTAMP |

            *Token usage and detailed execution stats available in the [job log](JOB_URL).*

            </details>
            ```

            Replace:
            - MODEL_NAME_HERE with the actual model
            - PROVIDER_HERE with the actual provider
            - LIST_OF_TOOLS_USED with tools used (e.g., Read, Grep, Glob)
            - JOB_URL with: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - UPDATE_TIMESTAMP with current datetime: `date -u +"%Y-%m-%d %H:%M:%S UTC"`

            ### Step 3: Edit or Create Comment

            ```bash
            # Save comment body to a file (properly escaped)
            cat > review_comment.md << 'REVIEW_EOF'
            [Your review summary here]

            <details>
            <summary>📊 Review metadata</summary>
            ...
            </details>
            REVIEW_EOF

            # Edit existing or create new comment
            if [ -n "$EXISTING_COMMENT" ]; then
              # Edit existing comment
              gh api \
                repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT \
                --method PATCH \
                -f body="$(cat review_comment.md)"
              echo "Updated existing comment"
            else
              # Create new comment
              gh pr comment ${{ github.event.pull_request.number }} --body-file review_comment.md
              echo "Created new comment"
            fi
            ```

            **Important:**
            - Do NOT include "Co-Authored-By" or "Note: Review generated using Claude Code" text
            - Always search for existing comments before posting
            - Use the exact `📊 Review metadata` marker to identify bot comments
          bot_id: 101855044
          bot_name: ${{ inputs.bot_name }}
          show_full_output: ${{ inputs.show_full_output }}
