name: Claude Code

on:
  workflow_call:
    inputs:
      provider:
        description: 'API provider to use (openrouter, anthropic, or zai)'
        required: false
        type: string
        default: 'openrouter'

      model:
        description: 'Model to use (e.g., anthropic/claude-3.5-haiku, @preset/claude-code-github-action)'
        required: false
        type: string
        default: '@preset/claude-code-github-action'

      bot_id:
        description: 'GitHub bot user ID'
        required: false
        type: string
        default: '101855044'

      bot_name:
        description: 'GitHub bot name'
        required: false
        type: string
        default: 'duyetbot'

      allowed_tools:
        description: 'Comma-separated list of allowed Claude tools'
        required: false
        type: string
        default: 'Read,Grep,Glob,Bash,Plan'

      file_patterns:
        description: 'Comma-separated file patterns to review (leave empty for all files)'
        required: false
        type: string
        default: ''

      show_full_output:
        description: 'Show full JSON output from Claude Code (WARNING: may expose secrets in logs)'
        required: false
        type: boolean
        default: true

      plugins:
        description: 'Newline-separated list of Claude Code plugins to install'
        required: false
        type: string
        default: ''

      plugin_marketplaces:
        description: 'Newline-separated list of plugin marketplace Git URLs'
        required: false
        type: string
        default: 'https://github.com/duyet/claude-plugins.git'

    secrets:
      api_key:
        description: 'API key (Anthropic or OpenRouter)'
        required: true
      bot_github_token:
        description: 'GitHub token for bot operations (PAT with repo access)'
        required: false

jobs:
  # Code review: triggered by PR assignment or @duyetbot mention in PR context
  pr-code-review:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'assigned') ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@duyetbot'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@claude') || contains(github.event.review.body, '@duyetbot')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowed-tools ${{ inputs.allowed_tools }}
            --mcp-config .github/mcp-config.json
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            MODEL: ${{ inputs.model }}
            PROVIDER: ${{ inputs.provider }}
            ${{ inputs.file_patterns != '' && format('FILE PATTERNS: {0}', inputs.file_patterns) || '' }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md (if available) for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            ## Comment Format Instructions
            When leaving your review comment on the PR using GitHub CLI:
            1. Start with your review content (findings, suggestions, etc.)
            2. End with a footer in this EXACT format using a collapsed details block:

            ```
            <details>
            <summary>📊 Review metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | MODEL_NAME_HERE |
            | Provider | PROVIDER_HERE |
            | Tools | LIST_OF_TOOLS_USED |
            | Reviewed by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |

            *Token usage and detailed execution stats available in the [job log](JOB_URL).*

            </details>
            ```

            Replace MODEL_NAME_HERE with the actual model from the MODEL variable above.
            Replace PROVIDER_HERE with the actual provider from the PROVIDER variable above.
            Replace LIST_OF_TOOLS_USED with the comma-separated list of tools you used during this review (e.g., Read, Grep, Glob).
            Replace JOB_URL with: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Do NOT include "Co-Authored-By" or "Note: Review generated using Claude Code" text.
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          show_full_output: ${{ inputs.show_full_output }}

  # Interactive help: triggered by mentions in comments, reviews, and issues
  interactive-help:
    if: |
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@duyetbot'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@claude') || contains(github.event.review.body, '@duyetbot'))) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@duyetbot') || contains(github.event.issue.title, '@duyetbot')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          additional_permissions: |
            actions: read
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          show_full_output: ${{ inputs.show_full_output }}

  # Issue plan: triggered by issue assignment to @duyetbot
  issue-plan:
    if: github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == '${{ inputs.bot_name }}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.bot_github_token }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ inputs.bot_name }}"
          git config --global user.email "${{ inputs.bot_name }}@users.noreply.github.com"

      - name: Run Claude Plan & Implementation
        id: plan
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          assignee_trigger: ${{ inputs.bot_name }}
          use_commit_signing: true
          additional_permissions: |
            contents: write
            pull-requests: write
            actions: read
          claude_args: |
            --allowed-tools "Read,Write,Edit,Bash,Glob,Grep,Plan,AskUserQuestion,Skill,mcp__sequential-thinking__sequentialthinking,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --mcp-config .github/mcp-config.json
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            MODEL: ${{ inputs.model }}
            PROVIDER: ${{ inputs.provider }}
            BOT_NAME: ${{ inputs.bot_name }}

            ## Task
            Analyze the assigned issue and take appropriate action based on its nature.

            ## Issue Context
            ```markdown
            ${{ github.event.issue.body }}
            ```

            ## Decision Tree

            ### Step 1: Classify the Issue
            Determine the issue type:
            - **Analysis/Planning**: Questions, explorations, "how to", architecture discussions
            - **Implementation**: Bug fixes, feature additions, refactoring tasks
            - **Documentation**: Docs updates, README changes, examples
            - **Investigation**: Bug reports needing diagnosis, performance issues
            - **CI/CD Issues**: Failed workflows, broken pipelines, job failures

            ### Step 2: Take Action Based on Type

            #### For Analysis/Planning Issues:
            Provide detailed analysis and comment on the issue:
            1. **Summary**: Brief overview of the issue
            2. **Analysis**: Key points, considerations, trade-offs
            3. **Approach**: Recommended steps or options
            4. **Estimate**: Rough complexity or effort level
            5. **Questions**: Any clarifying questions for the issue author

            Comment using: `gh issue comment ${{ github.event.issue.number }} --body "..."`

            #### For Implementation Issues:
            1. **Create a branch**: `git checkout -b issue-${{ github.event.issue.number }}-<brief-description>`
            2. **Implement the fix/feature**:
               - Read relevant files using Read, Glob, Grep
               - Make code changes using Edit or Write
               - Follow project conventions (check CLAUDE.md if exists)
            3. **Commit changes** (use semantic commit format):
               - `git commit -m "fix: resolve #${{ github.event.issue.number }} - brief description"`
               - Or for features: `git commit -m "feat: add #${{ github.event.issue.number }} - feature description"`
               - Or for other types: `docs:`, `refactor:`, `chore:`, `perf:`, etc.
               - Always include the issue number (#123) in the commit message
            4. **Push branch**: `git push origin issue-${{ github.event.issue.number }}-<brief-description>`
            5. **Create PR** (with semantic commit format in title): `gh pr create --title "fix: resolve #${{ github.event.issue.number }} - brief description" --body "Closes #${{ github.event.issue.number }}" --base main`
            6. **Comment on issue**: `gh issue comment ${{ github.event.issue.number }} --body "Implemented in PR #<pr-number>"`

            #### For Documentation Issues:
            1. Update the documentation files
            2. Commit with message: `docs: update #${{ github.event.issue.number }}`
            3. Create PR or push directly if minor
            4. Link back to issue

            #### For Investigation Issues:
            1. Use Read, Grep, Glob to explore the codebase
            2. Identify root cause or provide detailed findings
            3. Comment analysis on the issue with:
               - Investigation findings
               - Root cause (if bug)
               - Recommended fix or next steps
            4. If fix is straightforward, offer to implement

            #### For CI/CD Issues:
            1. Use `mcp__github_ci__get_ci_status` to check workflow run status
            2. Use `mcp__github_ci__get_workflow_run_details` for detailed workflow information
            3. Use `mcp__github_ci__download_job_log` to analyze job logs
            4. Identify the failure root cause from logs
            5. Comment analysis with:
               - Failed workflow/job information
               - Root cause of failure
               - Recommended fix or configuration changes
            6. If fix is straightforward (e.g., workflow syntax, simple config), implement it

            ## Comment Format
            When commenting on issues (using `gh issue comment`), ALWAYS include metadata footer:

            ```markdown
            <details>
            <summary>📊 Analysis metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | ${{ inputs.model }} |
            | Provider | ${{ inputs.provider }} |
            | Tools | <tools you used> |
            | Tokens | <tokens> |
            | More info ... | ...| 
            | Analyzed by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |

            *Token usage and detailed execution stats available in the [job log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).*

            </details>
            ```

            ## PR & Commit Format (Semantic Versioning - Required)

            **Format:** `<type>: <scope> - <subject> (<issue-number>)`

            **Examples:**
            - `fix: auth - resolve JWT validation issue (#123)`
            - `feat: api - add rate limiting support (#124)`
            - `docs: readme - update installation instructions (#125)`
            - `refactor: utils - simplify validation logic (#126)`
            - `perf: database - optimize user query (#127)`
            - `chore: dependencies - update security patches (#128)`

            **Valid types:** `fix`, `feat`, `docs`, `refactor`, `perf`, `chore`, `test`, `ci`, `build`

            **All commits and PR titles MUST follow this semantic format for consistency.**

            PR body:
            ```markdown
            ## Summary
            <Brief description of changes>

            ## Changes
            - <key change 1>
            - <key change 2>

            Closes #${{ github.event.issue.number }}

            ---
            <details>
            <summary>📊 Implementation metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | ${{ inputs.model }} |
            | Provider | ${{ inputs.provider }} |
            | Implemented by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |
            | Issue | #${{ github.event.issue.number }} |
            | ...| ... |

            </details>
            ```

            ## Rules
            - ALWAYS comment on the issue after analysis or implementation
            - For implementation tasks, prefer creating a PR over just commenting
            - Use git push origin <branch-name> after committing changes
            - Read existing code before making changes to understand patterns
            - Test locally if possible (run tests, linters)
            - Ask questions if issue requirements are unclear
            - Be concise but thorough in analysis

          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          show_full_output: ${{ inputs.show_full_output }}
