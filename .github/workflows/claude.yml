name: Claude Code

on:
  workflow_call:
    inputs:
      provider:
        description: 'API provider to use (openrouter, anthropic, or zai)'
        required: false
        type: string
        default: 'openrouter'

      model:
        description: 'Model to use (e.g., anthropic/claude-3.5-haiku, @preset/claude-code-github-action)'
        required: false
        type: string
        default: '@preset/claude-code-github-action'

      bot_id:
        description: 'GitHub bot user ID'
        required: false
        type: string
        default: '101855044'

      bot_name:
        description: 'GitHub bot name'
        required: false
        type: string
        default: 'duyetbot'

      allowed_tools:
        description: 'Comma-separated list of allowed Claude tools'
        required: false
        type: string
        default: 'Read,Grep,Glob,Bash,Plan'

      file_patterns:
        description: 'Comma-separated file patterns to review (leave empty for all files)'
        required: false
        type: string
        default: ''

      show_full_output:
        description: 'Show full JSON output from Claude Code (WARNING: may expose secrets in logs)'
        required: false
        type: boolean
        default: true

      plugins:
        description: 'Newline-separated list of Claude Code plugins to install'
        required: false
        type: string
        default: ''

      plugin_marketplaces:
        description: 'Newline-separated list of plugin marketplace Git URLs'
        required: false
        type: string
        default: 'https://github.com/duyet/claude-plugins.git'

    secrets:
      api_key:
        description: 'API key (Anthropic or OpenRouter)'
        required: true
      bot_github_token:
        description: 'GitHub token for bot operations (PAT with repo access)'
        required: false

jobs:
  # Code review: triggered by PR assignment or @duyetbot mention in PR context
  pr-code-review:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'assigned') ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@duyetbot'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@claude') || contains(github.event.review.body, '@duyetbot')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowed-tools ${{ inputs.allowed_tools }}
            --mcp-config .github/mcp-config.json
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            MODEL: ${{ inputs.model }}
            PROVIDER: ${{ inputs.provider }}
            ${{ inputs.file_patterns != '' && format('FILE PATTERNS: {0}', inputs.file_patterns) || '' }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md (if available) for guidance on style and conventions.
            Be constructive and helpful in your feedback.

            ## Inline Comments
            For specific code issues, use inline review comments on the exact lines:

            ### Creating Inline Review Comments
            Use the GitHub CLI to create line-specific review comments:

            ```bash
            # Single line comment
            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              -f body="Your review feedback here" \
              -f commit_id="${{ github.event.pull_request.head.sha }}" \
              -f path="path/to/file.ext" \
              -f position=42

            # position is the line number in the diff
            # path is the file path relative to repo root
            # commit_id is the PR head SHA
            ```

            ### Batch Comments
            For multiple inline comments, create a JSON file and use `gh api` with batch input:

            ```bash
            # Create comments.json
            cat > comments.json << 'EOF'
            [
              {"body": "Consider using const here", "commit_id": "SHA", "path": "src/file.js", "position": 10},
              {"body": "Missing error handling", "commit_id": "SHA", "path": "src/file.js", "position": 25}
            ]
            EOF

            # Apply all comments
            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              --input comments.json
            ```

            ## PR-Level Comment Format
            When leaving an overall review summary (after inline comments, if any):

            ### Step 1: Find Existing Bot Comment
            First, check if there's already a review comment from this bot on this PR:

            ```bash
            # Search for existing comment by bot
            EXISTING_COMMENT=$(gh api \
              repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq ".[] | select(.user.login == \"${{ inputs.bot_name }}\") | select(.body | contains(\"📊 Review metadata\")) | .id" | head -n1)

            if [ -n "$EXISTING_COMMENT" ]; then
              echo "Found existing comment ID: $EXISTING_COMMENT"
            else
              echo "No existing comment found, will create new"
            fi
            ```

            ### Step 2: Prepare Comment Body
            Create your review summary with this EXACT format:

            ```markdown
            <details>
            <summary>📊 Review metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | MODEL_NAME_HERE |
            | Provider | PROVIDER_HERE |
            | Tools | LIST_OF_TOOLS_USED |
            | Reviewed by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |
            | Updated | UPDATE_TIMESTAMP |

            *Token usage and detailed execution stats available in the [job log](JOB_URL).*

            </details>
            ```

            Replace:
            - MODEL_NAME_HERE with the actual model
            - PROVIDER_HERE with the actual provider
            - LIST_OF_TOOLS_USED with tools used (e.g., Read, Grep, Glob)
            - JOB_URL with: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - UPDATE_TIMESTAMP with current datetime: `date -u +"%Y-%m-%d %H:%M:%S UTC"`

            ### Step 3: Edit or Create Comment

            ```bash
            # Save comment body to a file (properly escaped)
            cat > review_comment.md << 'REVIEW_EOF'
            [Your review summary here]

            <details>
            <summary>📊 Review metadata</summary>
            ...
            </details>
            REVIEW_EOF

            # Edit existing or create new comment
            if [ -n "$EXISTING_COMMENT" ]; then
              # Edit existing comment
              gh api \
                repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT \
                --method PATCH \
                -f body="$(cat review_comment.md)"
              echo "Updated existing comment"
            else
              # Create new comment
              gh pr comment ${{ github.event.pull_request.number }} --body-file review_comment.md
              echo "Created new comment"
            fi
            ```

            **Important:**
            - Do NOT include "Co-Authored-By" or "Note: Review generated using Claude Code" text
            - Always search for existing comments before posting
            - Use the exact `📊 Review metadata` marker to identify bot comments
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          show_full_output: ${{ inputs.show_full_output }}

  # Interactive help: triggered by mentions in comments, reviews, and issues
  interactive-help:
    if: |
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@duyetbot'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@claude') || contains(github.event.review.body, '@duyetbot'))) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@duyetbot') || contains(github.event.issue.title, '@duyetbot')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          additional_permissions: |
            actions: read
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          show_full_output: ${{ inputs.show_full_output }}

  # Issue plan: triggered by issue assignment to @duyetbot (excludes PRs to prevent loops)
  issue-plan:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'assigned' &&
      github.event.assignee.login == inputs.bot_name &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Issue Analysis
        id: plan
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          assignee_trigger: ${{ inputs.bot_name }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Plan,AskUserQuestion,Skill,mcp__sequential-thinking__sequentialthinking,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --mcp-config .github/mcp-config.json
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            MODEL: ${{ inputs.model }}
            PROVIDER: ${{ inputs.provider }}
            BOT_NAME: ${{ inputs.bot_name }}

            ## Task
            Analyze the assigned issue and take appropriate action based on its nature.

            ## Issue Context
            ```markdown
            ${{ github.event.issue.body }}
            ```

            ## Decision Tree

            ### Step 1: Classify the Issue
            Determine the issue type:
            - **Analysis/Planning**: Questions, explorations, "how to", architecture discussions
            - **Implementation**: Bug fixes, feature additions, refactoring tasks
            - **Documentation**: Docs updates, README changes, examples
            - **Investigation**: Bug reports needing diagnosis, performance issues
            - **CI/CD Issues**: Failed workflows, broken pipelines, job failures

            ### Step 2: Take Action Based on Type

            **IMPORTANT**: This bot analyzes and provides recommendations only. It does NOT create branches, commits, or pull requests.

            #### For Analysis/Planning Issues:
            Provide detailed analysis and comment on the issue:
            1. **Summary**: Brief overview of the issue
            2. **Analysis**: Key points, considerations, trade-offs
            3. **Approach**: Recommended steps or options
            4. **Estimate**: Rough complexity or effort level
            5. **Questions**: Any clarifying questions for the issue author

            Comment using: `gh issue comment ${{ github.event.issue.number }} --body "..."`

            #### For Implementation Issues:
            Analyze the requirements and provide implementation guidance:
            1. **Read relevant files** using Read, Glob, Grep to understand the codebase
            2. **Identify affected components** and dependencies
            3. **Propose implementation approach**:
               - Step-by-step implementation plan
               - Code patterns to follow (check CLAUDE.md if exists)
               - Potential edge cases to handle
            4. **Suggest branch name** (semantic format):
               - Format: `<type>/#<issue>-<description>` (e.g., `fix/#123-auth-bug`, `feat/#124-api-endpoint`)
               - Types: `fix`, `feat`, `docs`, `refactor`, `perf`, `chore`, `test`
               - Use hyphens to separate words, lowercase only
            5. **Suggest commit message format**:
               - `fix: resolve #${{ github.event.issue.number }} - brief description`
               - Or for features: `feat: add #${{ github.event.issue.number }} - feature description`
            6. **Comment analysis** on the issue with findings and recommendations

            #### For Documentation Issues:
            1. Analyze the documentation changes needed
            2. Identify which files need updates
            3. Provide structure/content recommendations
            4. Comment analysis with specific suggestions

            #### For Investigation Issues:
            1. Use Read, Grep, Glob to explore the codebase
            2. Identify root cause or provide detailed findings
            3. Comment analysis on the issue with:
               - Investigation findings
               - Root cause (if bug)
               - Recommended fix or next steps

            #### For CI/CD Issues:
            1. Use `mcp__github_ci__get_ci_status` to check workflow run status
            2. Use `mcp__github_ci__get_workflow_run_details` for detailed workflow information
            3. Use `mcp__github_ci__download_job_log` to analyze job logs
            4. Identify the failure root cause from logs
            5. Comment analysis with:
               - Failed workflow/job information
               - Root cause of failure
               - Recommended fix or configuration changes

            ## Comment Format
            When commenting on issues (using `gh issue comment`), ALWAYS include metadata footer:

            ### Step 1: Find Existing Bot Comment
            First, check if there's already a comment from this bot on this issue:

            ```bash
            # Search for existing comment by bot
            EXISTING_COMMENT=$(gh api \
              repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
              --jq ".[] | select(.user.login == \"${{ inputs.bot_name }}\") | select(.body | contains(\"📊\")) | .id" | head -n1)

            if [ -n "$EXISTING_COMMENT" ]; then
              echo "Found existing comment ID: $EXISTING_COMMENT"
            else
              echo "No existing comment found, will create new"
            fi
            ```

            ### Step 2: Prepare Comment Body
            Create your comment with this metadata footer format:

            ```markdown
            [Your analysis or update content here]

            <details>
            <summary>📊 Analysis metadata</summary>

            | Property | Value |
            |----------|-------|
            | Model | ${{ inputs.model }} |
            | Provider | ${{ inputs.provider }} |
            | Tools | <tools you used> |
            | Tokens | <tokens> |
            | Updated | UPDATE_TIMESTAMP |
            | Analyzed by | [@${{ inputs.bot_name }}](https://github.com/${{ inputs.bot_name }}) |

            *Token usage and detailed execution stats available in the [job log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).*

            </details>
            ```

            Replace UPDATE_TIMESTAMP with: `date -u +"%Y-%m-%d %H:%M:%S UTC"`

            ### Step 3: Edit or Create Comment

            ```bash
            # Save comment body to a file
            cat > issue_comment.md << 'ISSUE_EOF'
            [Your comment content here]

            <details>
            <summary>📊 Analysis metadata</summary>
            ...
            </details>
            ISSUE_EOF

            # Edit existing or create new comment
            if [ -n "$EXISTING_COMMENT" ]; then
              # Edit existing comment
              gh api \
                repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT \
                --method PATCH \
                -f body="$(cat issue_comment.md)"
              echo "Updated existing comment"
            else
              # Create new comment
              gh issue comment ${{ github.event.issue.number }} --body-file issue_comment.md
              echo "Created new comment"
            fi
            ```

            **Important:**
            - Always search for existing comments before posting
            - Use the `📊` emoji marker to identify bot comments

            ## Suggested PR & Commit Format (For Human Implementation)

            When suggesting implementation to users, recommend this semantic format:

            **Commit format:** `<type>: <scope> - <subject> (#<issue-number>)`

            **Types:** `fix`, `feat`, `docs`, `refactor`, `perf`, `chore`, `test`, `ci`, `build`

            **Examples:**
            - `fix: auth - resolve JWT validation issue (#123)`
            - `feat: api - add rate limiting support (#124)`
            - `docs: readme - update installation instructions (#125)`

            **Branch format:** `<type>/#<issue>-<description>` (lowercase, hyphens)
            - `fix/#123-auth-bug`
            - `feat/#124-api-endpoint`

            ## Rules
            - ALWAYS comment on the issue with analysis and recommendations
            - Provide clear, actionable implementation guidance (NOT implementation)
            - Read existing code before suggesting changes to understand patterns
            - Ask questions if issue requirements are unclear
            - Be concise but thorough in analysis
            - This bot does NOT create branches, commits, or pull requests

          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          show_full_output: ${{ inputs.show_full_output }}
