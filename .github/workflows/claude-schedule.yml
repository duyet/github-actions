name: Claude Schedule

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Custom prompt for Claude to execute'
        required: true
        type: string

      provider:
        description: 'API provider to use (openrouter, anthropic, or zai)'
        required: false
        type: string
        default: 'openrouter'

      model:
        description: 'Model to use (e.g., anthropic/claude-3.5-haiku, @preset/claude-code-github-action)'
        required: false
        type: string
        default: '@preset/claude-code-github-action'

      allowed_tools:
        description: 'Comma-separated list of allowed Claude tools'
        required: false
        type: string
        default: 'Read,Grep,Glob,Write,Edit,Bash,Skill'

      file_patterns:
        description: 'Comma-separated file patterns to analyze (leave empty for all files)'
        required: false
        type: string
        default: ''

      dry_run:
        description: 'Dry run mode - plan only, no implementation'
        required: false
        type: string
        default: 'false'

      mcp_config:
        description: 'Override MCP config path (empty uses default from claude-defaults.json)'
        required: false
        type: string
        default: ''

      settings:
        description: 'Claude Code settings as JSON string or path to settings JSON file'
        required: false
        type: string
        default: ''

      claude_args:
        description: 'Additional arguments to pass directly to Claude CLI'
        required: false
        type: string
        default: ''

      max_turns:
        description: 'Maximum number of turns for Claude conversation'
        required: false
        type: string
        default: '25'

      timeout_minutes:
        description: 'Override timeout in minutes (empty uses default from claude-defaults.json)'
        required: false
        type: string
        default: ''

    secrets:
      api_key:
        description: 'API key (Anthropic or OpenRouter)'
        required: true

      bot_github_token:
        description: 'GitHub token for bot operations (defaults to GITHUB_TOKEN if not provided)'
        required: false

jobs:
  scheduled-task:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes != '' && inputs.timeout_minutes || 60 }}
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.bot_github_token || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Claude Environment
        id: claude-setup
        uses: duyet/github-actions/.github/actions/claude-setup@main
        with:
          workflow_type: 'schedule'
          mcp_config: ${{ inputs.mcp_config }}
          default_provider: ${{ inputs.provider }}
          default_model: ${{ inputs.model }}

      - name: Run Claude Scheduled Task
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.api_key }}
          ANTHROPIC_BASE_URL: ${{ steps.claude-setup.outputs.provider_base_url }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.claude-setup.outputs.model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.claude-setup.outputs.model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.claude-setup.outputs.model }}
        with:
          anthropic_api_key: ${{ secrets.api_key }}
          bot_id: ${{ steps.claude-setup.outputs.bot_id }}
          bot_name: ${{ steps.claude-setup.outputs.bot_name }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            TRIGGERED_BY: ${{ github.event_name }}
            RUN_ID: ${{ github.run_id }}

            ## Important Constraints

            This bot analyzes and provides recommendations only. It does NOT:
            - Create branches, commits, or pull requests
            - Modify code in the repository
            - Push any changes

            When suggesting actions to users, you may recommend:
            - Branch names (semantic format: `<type>/#<issue>-<description>`)
            - Commit message formats (`<type>: <scope> - <subject> (#<issue>)`)
            - PR title formats (following semantic commit format)

            **Suggested formats for human implementation:**
            - **Types:** `fix`, `feat`, `docs`, `refactor`, `perf`, `chore`, `test`, `ci`, `build`
            - **Examples:**
              - `fix: api - resolve timeout issue`
              - `feat: ui - add dark mode support`
              - `docs: readme - update installation guide`
            - **Branch format:** `<type>/#<issue>-<description>` (lowercase, hyphens)

            ---

            ${{ inputs.prompt }}
          claude_args: |
            --allowed-tools ${{ inputs.allowed_tools || steps.claude-setup.outputs.allowed_tools }}
            --mcp-config ${{ inputs.mcp_config || steps.claude-setup.outputs.mcp_config }}
            --max-turns ${{ inputs.max_turns }}
            ${{ inputs.claude_args }}
          settings: ${{ inputs.settings }}
          plugins: ''
          plugin_marketplaces: ${{ steps.claude-setup.outputs.plugin_marketplaces }}
